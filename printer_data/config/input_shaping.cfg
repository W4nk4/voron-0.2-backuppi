#####################################################################
# Input shaping
#####################################################################

[mcu host]
serial: /tmp/klipper_host_mcu

[adxl345] #BTT PI
cs_pin: host:gpio67
spi_bus: spidev0.0
axes_map: x,y,z

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 70
probe_points: 60,60,10

[input_shaper]
shaper_freq_x: 74.75
shaper_type_x: mzv
shaper_freq_y: 74.75
shaper_type_y: mzv